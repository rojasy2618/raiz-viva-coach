<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Raíz Viva Coach</title>
<meta name="theme-color" content="#0B2E22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Raíz Viva">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g9:#0B2E22;--g8:#0E3A2B;--g7:#124A37;--g5:#1F6F54;--g2:#DDE9E2;--cream:#F8F3E6;--cream2:#EFE7D2;--gold:#C9A44C;--gold2:#E2C77A;--ink:#17201B;--mut:#5B665F;--red:#B04A3A;--ok:#2E9E6B;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
button,input,textarea,select{font-family:inherit}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.serif{font-family:'Playfair Display',Georgia,serif}
#app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(86px + var(--sb))}
header.hd{background:radial-gradient(120% 140% at 20% 0%,#17604A,#0B2E22 62%,#071E16);color:var(--cream);padding:calc(18px + var(--st)) 20px 26px;border-radius:0 0 28px 28px;position:relative}
header.hd .row{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Playfair Display',serif;font-weight:800;font-size:1.25rem}.logo i{color:var(--gold2);font-weight:500}
.gear{background:rgba(255,255,255,.08);border:1px solid rgba(226,199,122,.25);color:var(--gold2);width:38px;height:38px;border-radius:50%;font-size:1.05rem;cursor:pointer}
header.hd h1{font-family:'Playfair Display',serif;font-size:1.65rem;line-height:1.15;margin:14px 0 4px}
header.hd p{color:#BFD0C7;font-size:.92rem}
main{padding:18px 16px 0}
.card{background:#fff;border:1px solid var(--cream2);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(20,50,40,.06)}
.card h3{font-family:'Playfair Display',serif;color:var(--g9);font-size:1.15rem;margin-bottom:4px}
.eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.mut{color:var(--mut);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,#E9CD82,#C9A44C);color:#0B2E22;font-weight:800;border:0;border-radius:999px;padding:14px 24px;font-size:1rem;cursor:pointer;width:100%;box-shadow:0 8px 22px rgba(201,164,76,.3)}
.btn.sec{background:transparent;border:1.5px solid var(--g5);color:var(--g7);box-shadow:none}
.btn.dark{background:var(--g7);color:var(--gold2);box-shadow:none}
.btn.small{width:auto;padding:9px 16px;font-size:.88rem}
.btn:active{transform:scale(.98)}
/* hero stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(226,199,122,.2);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--gold2);line-height:1.1}
.stat span{font-size:.7rem;color:#BFD0C7;letter-spacing:.04em}
/* ring */
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:0 0 84px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:800;color:var(--g7);font-size:1.15rem}
/* habits */
.habit{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid #F0EAD7;cursor:pointer}
.habit:last-child{border-bottom:0}
.habit .box{width:30px;height:30px;border-radius:10px;border:2px solid var(--gold);flex:0 0 30px;display:grid;place-items:center;color:#fff;font-weight:800;transition:.2s}
.habit.on .box{background:var(--g5);border-color:var(--g5)}
.habit .tx b{display:block;color:var(--g9);font-size:.97rem}
.habit .tx span{color:var(--mut);font-size:.82rem}
.habit.on .tx b{text-decoration:line-through;text-decoration-color:var(--gold);color:var(--mut)}
.habit .ic{margin-left:auto;font-size:1.3rem}
.new{display:inline-block;background:var(--gold);color:var(--g9);font-size:.6rem;font-weight:800;letter-spacing:.1em;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
/* mood */
.moods{display:flex;gap:6px;margin-top:10px}
.moods button{flex:1;border:1.5px solid var(--cream2);background:#fff;border-radius:12px;padding:9px 0;font-size:1.2rem;cursor:pointer}
.moods button.on{border-color:var(--gold);background:#FFF6DC}
.seg{display:flex;gap:8px;margin-top:10px}
.seg button{flex:1;border:1.5px solid var(--cream2);background:#fff;border-radius:12px;padding:10px 4px;font-size:.88rem;font-weight:600;color:var(--g7);cursor:pointer}
.seg button.on{background:var(--g7);color:var(--gold2);border-color:var(--g7)}
textarea,input[type=text],input[type=date]{width:100%;border:1.5px solid var(--cream2);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:72px;resize:vertical;margin-top:10px}
/* tabs nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--cream2);padding:8px 8px calc(8px + var(--sb));display:flex;justify-content:space-around;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:.68rem;font-weight:600;padding:6px 0;cursor:pointer;border-radius:12px}
nav.tabs button .i{font-size:1.35rem}
nav.tabs button.on{color:var(--g7);background:var(--g2)}
/* timer */
.stage{text-align:center}
.head{width:200px;margin:6px auto 0}
.zone{fill:rgba(201,164,76,.0);stroke:#C9A44C;stroke-width:0;transition:.4s}
.zone.on{fill:rgba(201,164,76,.55);stroke-width:3}
.time{font-family:'Playfair Display',serif;font-size:3.4rem;color:var(--g9);font-weight:800;line-height:1;margin:6px 0}
.steps{display:flex;gap:6px;margin:12px 0}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--cream2)}
.steps i.on{background:var(--gold)}.steps i.done{background:var(--g5)}
.cue{background:var(--g8);color:#EDE8D8;border-radius:16px;padding:14px 16px;text-align:left;margin:10px 0 14px}
.cue b{color:var(--gold2);font-family:'Playfair Display',serif;font-size:1.1rem}
/* breath */
.bwrap{display:grid;place-items:center;height:260px}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E9CD82,#C9A44C 55%,#8d6f25);box-shadow:0 0 60px rgba(201,164,76,.5);transform:scale(.7);transition:transform 4s ease-in-out;display:grid;place-items:center;color:var(--g9);font-weight:800;text-align:center;font-family:'Playfair Display',serif}
.orb small{font-size:.8rem;display:block;font-family:Inter;font-weight:600}
/* plan */
details.wk{background:#fff;border:1px solid var(--cream2);border-radius:18px;margin-bottom:10px;overflow:hidden}
details.wk summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
details.wk summary::-webkit-details-marker{display:none}
.wn{width:42px;height:42px;border-radius:12px;background:var(--g7);color:var(--gold2);display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:800;flex:0 0 42px}
.wk.cur .wn{background:var(--gold);color:var(--g9)}
.wk .body{padding:0 16px 16px;font-size:.93rem}
.wk .body ul{margin:8px 0 0 18px}
.pill{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--g2);color:var(--g7);margin-left:auto;white-space:nowrap}
.pill.gold{background:#FFF1CC;color:#7a5a10}
.photobar{background:#FFF6DC;border:1px solid #EFE0B0;border-radius:16px;padding:14px;margin-bottom:14px}
/* charts */
.chart text{font-family:Inter;font-size:10px;fill:#5B665F}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:#fff;border:1px solid var(--cream2);opacity:.45;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border-color:var(--gold);background:#FFF6DC}
.badge .e{font-size:1.7rem}.badge b{display:block;font-size:.72rem;color:var(--g9)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(7,30,22,.7);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .sheet{background:var(--cream);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:26px 22px calc(26px + var(--sb));animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.legal{font-size:.74rem;color:var(--mut);line-height:1.5;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%);background:var(--g9);color:var(--gold2);padding:10px 18px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:60;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.tip{border-left:4px solid var(--gold);background:#FFFBF0;border-radius:0 14px 14px 0;padding:12px 14px;font-size:.92rem;margin-top:12px}
.hide{display:none!important}
#report{display:none}
@media print{
 body>*:not(#report){display:none!important}
 #report{display:block!important;padding:20px;font-size:12px;background:#fff}
 #report h1{font-family:'Playfair Display',serif;font-size:22px}
 #report table{width:100%;border-collapse:collapse;margin:10px 0}
 #report td,#report th{border:1px solid #ccc;padding:5px 7px;text-align:left}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="nav" style="display:none"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div id="report"></div>

<script>
(function(){
'use strict';
var K='rvcoach.v1';
var HABITS=[
 {id:'cuero',n:'Cuidado del cuero cabelludo',s:'Lavado suave, sin uñas, enjuague abundante',ic:'🧴',w:1},
 {id:'sueno',n:'Sueño de 7 a 8 horas',s:'Hora fija y pantallas fuera 30 min antes',ic:'🌙',w:1},
 {id:'masaje',n:'Masaje de 4 minutos',s:'Usa la pestaña Masaje',ic:'💆',w:2},
 {id:'plato',n:'Plato Raíz Viva en 2 comidas',s:'Proteína + hierro con vitamina C',ic:'🥗',w:3},
 {id:'resp',n:'Respiración 4-6',s:'Usa la pestaña Respira',ic:'🌬️',w:4},
 {id:'mov',n:'Movimiento de 20 minutos',s:'Caminar, trotar o fuerza',ic:'🚶',w:4}
];
var WEEKS=[
 {t:'Línea base y orden',m:'Toma tus 5 fotos de línea base, ajusta tu rutina de lavado y fija tu hora de dormir.',g:['Fotos de línea base (frente, izquierda, derecha, coronilla, nuca)','Ajustar tu rutina de lavado','Fijar hora de dormir','Agendar consulta si cumples alguna señal de alerta'],tip:'No busques cambios todavía: busca constancia.'},
 {t:'Masaje de 4 minutos',m:'Suma el masaje diario ligado a un momento fijo del día.',g:['Masaje al menos 5 días','Pedir exámenes si tu médico los indicó'],tip:'Asócialo a algo que ya haces: ducharte o prepararte para dormir.'},
 {t:'Plato Raíz Viva',m:'Organiza dos comidas al día con proteína y una fuente de hierro más vitamina C.',g:['Plato Raíz Viva en 2 comidas diarias','Café y té lejos de las comidas ricas en hierro'],tip:'Limón, naranja o kiwi con las lentejas ayudan a absorber el hierro.'},
 {t:'Respiración y movimiento',m:'Agrega 5 minutos de respiración 4-6 y 20 minutos de movimiento.',g:['Respiración 4-6 cada día','Movimiento 3 a 4 veces por semana','Fotos del mes 1 y comparación con la semana 1'],tip:'Hoy toca foto de seguimiento si no la hiciste.'},
 {t:'Un producto natural, opcional',m:'Si quieres, prueba el tónico de romero con prueba de parche. Un producto a la vez.',g:['Prueba de parche de 24 horas','Tónico de romero 3 veces por semana (opcional)'],tip:'Introduce una sola novedad y espera 2 semanas antes de otra.'},
 {t:'Revisión de exámenes',m:'Con tus resultados, ajusta alimentación o acuerda con tu médico los siguientes pasos.',g:['Revisar resultados con tu médico','Ajustar alimentación según los resultados'],tip:'No te suplementes por tu cuenta sin indicación.'},
 {t:'Rutina de estrés',m:'Elige un hábito de descarga que disfrutes y protege tu hora de dormir.',g:['Elegir tu hábito de descarga','Pantallas fuera 30 minutos antes de dormir'],tip:'Caminar, música, hablar con alguien: lo que sí vas a sostener.'},
 {t:'Medición del mes 2',m:'Repite tus 5 fotos y evalúa qué hábito te cuesta más para simplificarlo.',g:['Repetir las 5 fotos del mes 2','Simplificar el hábito que más cuesta'],tip:'Compara siempre con la misma luz y distancia.'},
 {t:'Consolidar tu rutina',m:'Tu rutina ya debería ser casi automática. Quita lo que pese.',g:['Mantener rutina completa','Quitar o cambiar lo que te pesa'],tip:'La mejor rutina es la que sostienes.'},
 {t:'Consulta de seguimiento',m:'Si estás en tratamiento médico, agenda la revisión de tolerancia y primeras señales.',g:['Agendar o hacer la consulta de seguimiento','Llevar tus fotos y registros'],tip:'Tu historial ayuda a decidir con tu médico.'},
 {t:'Revisión de hábitos de vida',m:'Revisa sueño, alcohol, tabaco y estrés. Ajusta una cosa, no todo.',g:['Revisar sueño, alcohol y tabaco','Ajustar un solo hábito'],tip:'Un cambio pequeño y sostenido gana.'},
 {t:'Fotos del mes 3 y balance',m:'Compara las 5 fotos de la semana 1 con las de la semana 12 y decide qué mantienes.',g:['Fotos del mes 3','Comparar con la semana 1','Decidir qué mantener, ajustar o quitar'],tip:'Un buen resultado también es frenar el avance y sentir control.'}
];
var PHOTOWK=[1,4,8,12];
var STEPS=[
 {n:'Sienes y frente',d:'Yemas de los dedos, círculos pequeños con presión media. Mueve la piel, no resbales sobre ella.',z:'z1'},
 {n:'Laterales y encima de las orejas',d:'Presiona y suelta, o desliza hacia arriba lentamente.',z:'z2'},
 {n:'Coronilla',d:'Círculos amplios con las dos manos hacia la parte alta de la cabeza.',z:'z3'},
 {n:'Nuca y cuello',d:'De la base del cráneo hacia arriba. Termina soltando los hombros.',z:'z4'}
];
var FAST=/[?&]fast=1/.test(location.search);
var STEPSEC=FAST?3:60;
var MSGS=['Hoy no se trata de hacerlo perfecto, sino de hacerlo.','Un hábito pequeño hoy vale más que un plan enorme mañana.','Tu cabello responde a la constancia, no a la prisa.','Cuidarte también es una forma de quererte.','Cada casilla marcada es un voto por ti.','Lo que repites se vuelve tuyo. Sigue.','Estás construyendo algo que se nota con el tiempo.'];
function nm(){return S.name?S.name.split(' ')[0]:''}
function hello(){var h=new Date().getHours();var g=h<12?'Buenos días':(h<19?'Buenas tardes':'Buenas noches');return g+(nm()?', '+nm():'')}
function dailyMsg(){var d=dayNum();var m=MSGS[(d-1)%MSGS.length];return m}
function def(){return {v:1,name:'',start:'',days:{},ok:false}}
var S;
function load(){try{var r=localStorage.getItem(K);S=r?JSON.parse(r):def()}catch(e){S=def()}if(!S||!S.days)S=def()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function iso(d){var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return y+'-'+m+'-'+dd}
function today(){return iso(new Date())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dayNum(){if(!S.start)return 1;return Math.floor((parse(today())-parse(S.start))/86400000)+1}
function weekNum(d){var n=Math.floor((d-1)/7)+1;return n<1?1:(n>12?12:n)}
function activeHabits(w){return HABITS.filter(function(h){return h.w<=w})}
function dayRec(k){if(!S.days[k])S.days[k]={h:[],mood:0,shed:'',note:''};return S.days[k]}
function dayDone(k){var r=S.days[k];if(!r)return 0;return r.h.length}
function dayPct(k){var d=Math.floor((parse(k)-parse(S.start))/86400000)+1;if(d<1)return 0;var w=weekNum(d);var a=activeHabits(w).length;var r=S.days[k];if(!r)return 0;var c=r.h.filter(function(id){return activeHabits(w).some(function(x){return x.id===id})}).length;return Math.round(c/a*100)}
function streak(){var n=0,d=parse(today());var k=iso(d);if(dayPct(k)<70){d.setDate(d.getDate()-1)}
 while(true){var kk=iso(d);if(parse(kk)<parse(S.start))break;if(dayPct(kk)>=70){n++;d.setDate(d.getDate()-1)}else break}return n}
function weekPct(w){var tot=0,got=0;for(var i=0;i<7;i++){var d=parse(S.start);d.setDate(d.getDate()+(w-1)*7+i);if(d>parse(today()))break;var k=iso(d);tot++;got+=dayPct(k)}return tot?Math.round(got/tot):null}
function $(s){return document.querySelector(s)}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
var view='hoy';
var NAV=[['hoy','🏠','Hoy'],['masaje','💆','Masaje'],['resp','🌬️','Respira'],['plan','🗓️','Plan'],['prog','📈','Progreso']];
function nav(){var n=$('#nav');n.style.display='flex';n.innerHTML=NAV.map(function(x){return '<button data-v="'+x[0]+'" class="'+(view===x[0]?'on':'')+'"><span class="i">'+x[1]+'</span>'+x[2]+'</button>'}).join('')}
document.addEventListener('click',function(e){var b=e.target.closest('#nav button');if(b){go(b.getAttribute('data-v'))}});
function go(v){if(v!=='masaje')stopTimer(true);if(v!=='resp')stopBreath(true);view=v;render();window.scrollTo(0,0)}
function header(title,sub){return '<header class="hd"><div class="row"><div class="logo">RAÍZ <i>Viva</i> Coach</div><button class="gear" id="gear" aria-label="Ajustes">⚙</button></div><h1>'+title+'</h1><p>'+sub+'</p>'+(arguments[2]||'')+'</header>'}
function render(){
 var a=$('#app');
 if(!S.start||!S.ok){a.innerHTML=welcome();$('#nav').style.display='none';bindWelcome();return}
 nav();
 if(view==='hoy')a.innerHTML=vHoy();
 else if(view==='masaje')a.innerHTML=vMasaje();
 else if(view==='resp')a.innerHTML=vResp();
 else if(view==='plan')a.innerHTML=vPlan();
 else if(view==='prog')a.innerHTML=vProg();
 else if(view==='aj')a.innerHTML=vAj();
 bind();
}
/* WELCOME */
function welcome(){return '<header class="hd" style="padding-bottom:34px"><div class="logo">RAÍZ <i>Viva</i> Coach</div><h1 style="font-size:2rem;margin-top:22px">Bienvenido a tu plan de 12 semanas</h1><p>Un compañero diario para tus hábitos, tu masaje y tu respiración. Hecho a tu medida.</p></header><main><div class="card"><h3>Hagámoslo personal</h3><p class="mut" style="margin-bottom:12px">Tus datos se guardan solo en este dispositivo. No hay cuentas ni servidores.</p><label class="mut">¿Cómo te gustaría que te llame?</label><input type="text" id="wn" placeholder="Tu nombre" value="'+(S.name||'')+'" style="margin:6px 0 14px"><label class="mut">¿Cuándo empieza tu semana 1?</label><input type="date" id="ws" value="'+(S.start||today())+'" style="margin:6px 0 14px"><label style="display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--mut);margin-bottom:14px"><input type="checkbox" id="wc" style="margin-top:4px;width:18px;height:18px"><span>Entiendo que esta app es informativa y educativa, no es consejo médico y no garantiza resultados. Consultaré a un profesional de la salud ante dudas.</span></label><button class="btn" id="wgo">Comenzar mi plan</button></div></main>'}
function bindWelcome(){$('#wgo').onclick=function(){if(!$('#wc').checked){toast('Marca la casilla para continuar');return}var s=$('#ws').value||today();S.name=$('#wn').value.trim();S.start=s;S.ok=true;save();view='hoy';render()}}
/* HOY */
function vHoy(){
 var d=dayNum(),w=weekNum(d),k=today(),r=dayRec(k),hs=activeHabits(w);
 var done=r.h.filter(function(id){return hs.some(function(x){return x.id===id})}).length;var pct=Math.round(done/hs.length*100);
 var greet=hello()+' 👋';
 var finished=d>84;
 var sub=finished?'Completaste tus 12 semanas'+(nm()?', '+nm():'')+'. ¡Enhorabuena!':'Día '+d+' de 84 · Semana '+w+': '+WEEKS[w-1].t;
